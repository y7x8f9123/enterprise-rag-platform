
spring.application.name=backend

spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=25MB

app.storage.location=./uploads

# File-backed metadata for local development. Document contents remain on disk
# and are never stored in this database.
spring.datasource.url=jdbc:h2:file:./data/document-metadata;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

app.ai-service.url=http://127.0.0.1:8000
app.ai-service.connect-timeout-ms=5000
app.ai-service.read-timeout-ms=180000
